services:
  # Applies Paper settings (anti-xray, entity collisions; defined under "configs" at the bottom)
  # before the server starts. Merges into Paper's configs, so everything else is kept.
  anti-xray:
    image: mikefarah/yq:4
    container_name: minecraft-anti-xray
    restart: "no"
    working_dir: /workdir
    volumes:
      - ./data:/workdir
    configs:
      - source: anti-xray-overworld
        target: /patches/overworld.yml
      - source: anti-xray-nether
        target: /patches/nether.yml
      - source: paper-global
        target: /patches/global.yml
      - source: spigot
        target: /patches/spigot.yml
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apply() {
          if [ -f "$$1" ]; then
            yq -i ". *= load(\"$$2\")" "$$1" && echo "paper settings applied: $$1"
          else
            echo "skip: $$1 not created yet (run 'docker compose up -d' again later)"
          fi
        }
        apply config/paper-world-defaults.yml /patches/overworld.yml
        apply world_nether/paper-world.yml    /patches/nether.yml
        apply config/paper-global.yml         /patches/global.yml
        apply spigot.yml                      /patches/spigot.yml

  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 60s        # give the server time to save the world on shutdown
    depends_on:
      anti-xray:
        condition: service_completed_successfully

    ports:
      - "25565:25565"             # Java Edition; RCON stays internal (use: docker exec -it minecraft rcon-cli)
      - "19132:19132/udp"         # Bedrock Edition via Geyser (UDP only)

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"               # much lighter than vanilla; same client compatibility
      VERSION: "26.2"
      MEMORY: "8G"                # JVM heap (sets both -Xms and -Xmx)
      USE_AIKAR_FLAGS: "true"     # tuned G1GC flags, reduces lag spikes
      TZ: "Europe/Stockholm"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password   # shared with the backups service

      # Server settings
      MAX_PLAYERS: "18"
      VIEW_DISTANCE: "14"         # biggest single lever on RAM/CPU per player; must be >= simulation distance
      SIMULATION_DISTANCE: "12"   # vanilla default is 10; higher spreads the mob cap wider, so farms run a bit slower
      DIFFICULTY: "normal"

      # Optional resource pack (textures for the cartel datapack items; see resourcepack/README.md).
      # Players are asked on join; declining just shows the vanilla item textures.
      RESOURCE_PACK: "https://raw.githubusercontent.com/n7on/minecraft/main/resourcepack/kartell-texturer.zip"
      RESOURCE_PACK_SHA1: "4766cc6ba3981f7f5f3066c47603695d72ebb40a"
      RESOURCE_PACK_ENFORCE: "FALSE"
      MOTD: "Minecraft server"

      # Access control
      ONLINE_MODE: "TRUE"         # require real Microsoft accounts
      ENABLE_WHITELIST: "TRUE"    # only listed players can join
      ENFORCE_WHITELIST: "TRUE"   # kick players removed from the list immediately
      OPS: "an7dud"               # comma-separated admins (can /kick, /ban, /whitelist add)
      ENFORCE_SECURE_PROFILE: "FALSE"  # off: bots (mineflayer) don't implement signed-chat and
                                        # get kicked ("chat message validation failure") with this on;
                                        # whitelist + online-mode already gate who can connect
      # Manage the list in-game: /whitelist add <name>  (saved in data/whitelist.json)
      # Bedrock players: /fwhitelist add <xbox gamertag>  (they show up in-game as .<gamertag>)

      # Plugins (server-side only; players need no client changes)
      # Downloaded from Modrinth on start; add more slugs on new lines (modrinth.com/plugin/<slug>)
      # viaversion is required by Geyser: it connects as the newest Java client (26.x)
      # viabackwards lets older Java clients (e.g. 1.21.11) join the newer server
      # essentialsx is pinned to 2.22.0 (nY6VN1XH): Modrinth lists it only up to 26.1.2, so an
      # unpinned slug fails to resolve on newer servers. Unpin once a newer release lists 26.2.
      # grimac removed: its packetevents kicks 26.x clients (incl. Geyser/Bedrock) on a
      # 1.21.11 server with "invalid packet". Re-add when fixed or after upgrading the server.
      # chunky pre-generates terrain (/chunky start) so players load chunks from disk instead of generating them
      # tradecycle: cycle villager trades without any client mod (offhand-swap key in the trade UI,
      # or shift-right-click the villager; the latter also works for Bedrock players).
      MODRINTH_PROJECTS: |
        essentialsx:nY6VN1XH
        viaversion
        viabackwards
        tradecycle
        chunky

      # Bedrock support: Geyser translates Bedrock <-> Java, Floodgate lets Bedrock
      # players join with their Xbox account (no Java account needed).
      # Official GeyserMC builds, latest version on each start.
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

    volumes:
      - ./data:/data
    secrets:
      - rcon_password

    deploy:
      resources:
        limits:
          memory: 10G             # hard cap: heap + ~2G for JVM overhead (metaspace, threads, native buffers)
          cpus: "3.0"
        reservations:
          memory: 8G

  # World backups: tar.gz every 2h into ./backups, kept 4 days (~1 GB each). Uses RCON to pause
  # autosave during the copy. Skips the backup if nobody has played since the last one.
  # Restore: stop minecraft, extract a backup over ./data, start again.
  backups:
    image: itzg/mc-backup:latest
    container_name: minecraft-backups
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      TZ: "Europe/Stockholm"
      RCON_HOST: minecraft
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      BACKUP_INTERVAL: "2h"
      INITIAL_DELAY: "5m"
      PRUNE_BACKUPS_DAYS: "4"
      PAUSE_IF_NO_PLAYERS: "true"
      BACKUP_METHOD: tar
      EXCLUDES: "*.jar,cache,.cache,libraries,logs,versions"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    secrets:
      - rcon_password

  # Runs the paused Chunky pre-generation only while nobody is online (it drops TPS badly on
  # 4 cores), and pauses it as soon as someone joins. Start a task once with /chunky start.
  pregen:
    image: itzg/mc-backup:latest   # reused for its rcon-cli + shell
    container_name: minecraft-pregen
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      RCON_HOST: minecraft
    entrypoint: ["sh", "-c"]
    command:
      - |
        export RCON_PASSWORD="$$(cat /run/secrets/rcon_password)"
        state=""
        while true; do
          sleep 30
          players=$$(rcon-cli list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -oE 'There are [0-9]+' | grep -oE '[0-9]+')
          [ -z "$$players" ] && continue          # server down or restarting
          if [ "$$players" -eq 0 ] && [ "$$state" != running ]; then
            rcon-cli chunky continue >/dev/null && state=running
          elif [ "$$players" -gt 0 ] && [ "$$state" != paused ]; then
            rcon-cli chunky pause >/dev/null && state=paused
          fi
        done
    secrets:
      - rcon_password

secrets:
  rcon_password:
    file: ./rcon_password       # random, gitignored; generate with: openssl rand -hex 24 > rcon_password

# Paper settings, merged into Paper's config files by the anti-xray service.
# "anti-xray-overworld" goes into paper-world-defaults.yml, so it applies to every world
# unless a world overrides it; "paper-global" goes into paper-global.yml.
# Edit here, then run "docker compose stop minecraft && docker compose up -d" to apply.
configs:
  spigot:
    content: |
      world-settings:
        default:
          entity-activation-range:
            monsters: 64            # default 32; mobs further from players barely tick (farms stall)
            flying-monsters: 64     # default 32; ghasts, phantoms

  paper-global:
    content: |
      unsupported-settings:
        allow-piston-duplication: true   # re-enables vanilla TNT, carpet and rail duping
        allow-headless-pistons: true     # headless pistons (can break bedrock/end portal frames)
        allow-unsafe-end-portal-teleportation: true   # re-enables sand/gravel duping via end portals
        update-equipment-on-player-actions: false     # re-enables vanilla attribute swapping (PvP)
      chunk-loading-basic:
        player-max-chunk-load-rate: 150.0   # default 100; chunks/s read from disk per player
        player-max-chunk-send-rate: 120.0   # default 75; chunks/s sent per player (costs upload bandwidth)

  anti-xray-overworld:
    content: |
      collisions:
        max-entity-collisions: 32   # default 8; must exceed max_entity_cramming (24) for cramming farms
      anticheat:
        anti-xray:
          enabled: true
          engine-mode: 2            # fills hidden areas with fake ores
          max-block-height: 64
          update-radius: 2
          lava-obscures: false
          use-permission: false
          hidden-blocks:
            - copper_ore
            - deepslate_copper_ore
            - raw_copper_block
            - gold_ore
            - deepslate_gold_ore
            - iron_ore
            - deepslate_iron_ore
            - raw_iron_block
            - coal_ore
            - deepslate_coal_ore
            - lapis_ore
            - deepslate_lapis_ore
            - redstone_ore
            - deepslate_redstone_ore
            - diamond_ore
            - deepslate_diamond_ore
            - emerald_ore
            - deepslate_emerald_ore
            - mossy_cobblestone
            - chest
            - spawner
          replacement-blocks:
            - stone
            - oak_planks
            - deepslate

  anti-xray-nether:
    content: |
      anticheat:
        anti-xray:
          enabled: true
          engine-mode: 2
          max-block-height: 128
          update-radius: 2
          lava-obscures: false
          use-permission: false
          hidden-blocks:
            - ancient_debris
            - nether_gold_ore
            - nether_quartz_ore
          replacement-blocks:
            - netherrack
            - basalt
            - blackstone
